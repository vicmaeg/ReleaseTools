name: Create release tag

on:
  workflow_dispatch:
    inputs:
      tool:
        description: Tool to release
        required: true
        type: choice
        options:
          - semver
          - calver
          - scalver

permissions:
  contents: read

concurrency:
  group: create-release-tag-${{ inputs.tool }}
  cancel-in-progress: false

jobs:
  create-tag:
    runs-on: ubuntu-latest

    steps:
      - name: Require release token
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [[ -z "${RELEASE_TOKEN:-}" ]]; then
            echo "RELEASE_TOKEN is required to push a tag that triggers the publish workflow" >&2
            exit 1
          fi

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Calculate release version
        id: release
        shell: bash
        env:
          TOOL: ${{ inputs.tool }}
        run: |
          set -euo pipefail

          case "$TOOL" in
            semver)
              version=$(dotnet run --file src/semver.cs -- --prefix semver-v)
              ;;
            calver)
              version=$(dotnet run --file src/calver.cs)
              ;;
            scalver)
              major=$(jq -er '.scalverMajor | select(type == "number" and . >= 0 and floor == .)' release.json)
              version=$(dotnet run --file src/scalver.cs -- --major "$major" --date-format YYYYMMDD)
              ;;
            *)
              echo "Unsupported tool: $TOOL" >&2
              exit 1
              ;;
          esac

          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Calculated version is not a stable three-part version: $version" >&2
            exit 1
          fi

          tag="$TOOL-v$version"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Tag already exists; there is no new version to release: $tag" >&2
            exit 1
          fi

          echo "tool=$TOOL" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

      - name: Write workflow summary
        env:
          TOOL: ${{ steps.release.outputs.tool }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          {
            echo "## Release tag created"
            echo
            echo "- Tool: \`$TOOL\`"
            echo "- Version: \`$VERSION\`"
            echo "- Tag: \`$TAG\`"
            echo "- Commit: \`$COMMIT\`"
          } >> "$GITHUB_STEP_SUMMARY"

name: Publish packages and create release tags

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-release-tags
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Calculate, publish, and tag missing versions
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          SCALVER_MAJOR=$(jq -er '.scalverMajor | select(type == "number" and . >= 0 and floor == .)' release.json)
          SEMVER_VERSION=$(dotnet run --file src/semver.cs -- --prefix semver-v)
          CALVER_VERSION=$(dotnet run --file src/calver.cs)
          SCALVER_VERSION=$(dotnet run --file src/scalver.cs -- --major "$SCALVER_MAJOR" --date-format YYYYMMDD)

          publish_tool() {
            local tool="$1"
            local package_id="$2"
            local version="$3"
            local tag="$4"

            if git show-ref --verify --quiet "refs/tags/$tag"; then
              echo "Tag already exists: $tag"
              return
            fi

            if [[ -z "${NUGET_API_KEY:-}" ]]; then
              echo "NUGET_API_KEY is required to publish $package_id" >&2
              return 1
            fi

            dotnet pack "src/$tool.cs" \
              --configuration Release \
              --output artifacts \
              -p:PackageVersion="$version"

            local nupkg="artifacts/$package_id.$version.nupkg"
            if [[ ! -f "$nupkg" ]]; then
              echo "Expected package not found: $nupkg" >&2
              return 1
            fi

            dotnet nuget push "$nupkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate

            git tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
          }

          publish_tool semver ReleaseTools.SemVer "$SEMVER_VERSION" "semver-v$SEMVER_VERSION"
          publish_tool calver ReleaseTools.CalVer "$CALVER_VERSION" "calver-v$CALVER_VERSION"
          publish_tool scalver ReleaseTools.ScalVer "$SCALVER_VERSION" "scalver-v$SCALVER_VERSION"

      - name: Upload published packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: ignore

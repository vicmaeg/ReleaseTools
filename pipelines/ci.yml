name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Verify .NET version
        run: dotnet --version
      
      - name: Build ver.cs
        run: dotnet build src/ver.cs --configuration Release
      
      - name: Run tests
        run: |
          cd test
          dotnet restore
          dotnet test --configuration Release --verbosity normal
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test/TestResults/
